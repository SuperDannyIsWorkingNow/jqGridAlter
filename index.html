<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GridMaster - jqGrid Feature Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
       /* Custom Scrollbar for a cleaner app feel */
       ::-webkit-scrollbar {
         width: 8px;
         height: 8px;
       }
       ::-webkit-scrollbar-track {
         background: transparent; 
       }
       ::-webkit-scrollbar-thumb {
         background: #cbd5e1; 
         border-radius: 4px;
       }
       ::-webkit-scrollbar-thumb:hover {
         background: #94a3b8; 
       }
       .dark ::-webkit-scrollbar-thumb {
          background: #475569;
       }
       .dark ::-webkit-scrollbar-thumb:hover {
          background: #64748b;
       }
    </style>
    <script>
        tailwind.config = {
          darkMode: 'media', 
          theme: {
            extend: {
              colors: {
                gray: {
                  950: '#020617',
                }
              }
            }
          }
        }
    </script>
