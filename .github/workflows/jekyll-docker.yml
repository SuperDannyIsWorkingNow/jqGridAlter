name: Jekyll site CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 部署到 GitHub Pages 必需的權限設定
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # --- 1. 設定 Ruby 環境 (修正: 使用 '3.2' 替代 '3.x') ---
      # Jekyll 是一個 Ruby 專案，需要先設定 Ruby 環境
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2' # <--- 修正為穩定的主要版本號 3.2
          bundler-cache: true # 啟用 Bundler 快取，加速 Gem 安裝
          cache-version: 1 # 當您更改 Gemfile 時，可以增加此版本號來強制重新快取
          
      # --- 2. 建構 Jekyll 網站 (替換原 Docker 步驟) ---
      - name: Install dependencies and Build Jekyll site
        run: |
          # 檢查並安裝所有 Gemfile 中的依賴
          bundle install 
          # 使用 Bundler 來執行 Jekyll 建構，--future 保持不變
          bundle exec jekyll build --future

      # --- 3. 部署設定步驟 (保持不變) ---
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # --- 4. 上傳建構成品步驟 (保持不變) ---
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site' # Jekyll 預設的輸出目錄

      # --- 5. 部署到 GitHub Pages (保持不變) ---
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        env:
          ACTIONS_STEP_DEBUG: true # 可選：啟用詳細的除錯日誌
